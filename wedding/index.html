<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mazen &amp; Manar · 29 November 2026</title>
<meta name="description" content="You are invited to the wedding of Mazen &amp; Manar. Sunday 29 November 2026, Lagona Vista Hall. Leave them a wish in the guest book.">
<meta property="og:title" content="Mazen &amp; Manar · 29 November 2026">
<meta property="og:description" content="You are invited! Leave a wish for the couple in our guest book.">
<meta property="og:image" content="slide1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&family=Noto+Nastaliq+Urdu:wght@600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/*
VOICE   tender, elegant, few hues
IDEA    the printed invitation card, continued into a keepsake guest book
PICTURE the two illustrated invitation slides
COLOUR  blush paper, deep rose ink, antique gold
TYPE    Great Vibes names, Cormorant text, Nastaliq Arabic
*/
:root{
  /* Settings: paste the Google Apps Script web app URL between the quotes in the script at the bottom */
  --paper:#f7ddd3; --ink:#6e2a37; --rose:#8c3a4b; --gold:#a8783f; --card:#fff6f2;
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:500 19px/1.55 "Cormorant Garamond",Georgia,serif;
  background:var(--paper) url(paper.jpg) center top/cover fixed;overflow-x:clip}
a{color:var(--rose)}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 60px}
.slide{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 18px 40px -18px rgba(110,42,55,.45),0 2px 6px rgba(110,42,55,.12);margin:0 0 22px}
.hint{text-align:center;font-style:italic;color:var(--rose);margin:-6px 0 26px;font-size:18px}
.book{position:relative;background:var(--card);border-radius:18px;padding:34px 24px 28px;
  box-shadow:0 18px 40px -20px rgba(110,42,55,.4);border:1.5px solid rgba(168,120,63,.55)}
.book::before{content:"";position:absolute;inset:8px;border:1px solid rgba(168,120,63,.35);border-radius:13px;pointer-events:none}
h2{font:400 64px/1 "Great Vibes",cursive;text-align:center;margin:0;color:var(--ink)}
.ar{font-family:"Noto Nastaliq Urdu","Amiri",serif;direction:rtl;text-align:center;color:var(--rose);font-size:26px;line-height:2.2;margin:4px 0 0}
.sub{text-align:center;margin:6px 0 22px;font-style:italic;color:var(--rose)}
form{display:grid;gap:12px}
label{font-weight:600;font-size:17px}
input,textarea{width:100%;font:500 18px/1.4 "Cormorant Garamond",Georgia,serif;color:var(--ink);background:#fffaf8;
  border:1.5px solid rgba(168,120,63,.55);border-radius:10px;padding:12px 14px;min-height:48px}
input,textarea{font-size:16px}
@media(min-width:420px){input,textarea{font-size:18px}}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(140,58,75,.35);outline-offset:2px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;color:#8a5a62}
button{font:700 19px "Cormorant Garamond",Georgia,serif;letter-spacing:.04em;color:#fff;background:var(--rose);
  border:0;border-radius:999px;min-height:50px;padding:0 28px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.status{min-height:24px;text-align:center;font-style:italic;color:var(--rose);margin:4px 0 0}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);margin:28px 0 18px}
.orn i{display:block;width:90px;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.count{text-align:center;color:#8a5a62;font-size:16px;margin:-6px 0 14px}
.wishes{display:grid;gap:14px;list-style:none;margin:0;padding:0}
.wish{background:#fffaf8;border:1px solid rgba(168,120,63,.35);border-radius:12px;padding:14px 16px}
.wish p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:19px}
.wish p[dir=rtl]{font-family:"Amiri",serif;font-size:19px;line-height:1.8}
.wish .by{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:#8a5a62}
.wish .by b{color:var(--ink);font-weight:700}
.empty{text-align:center;font-style:italic;color:#8a5a62;padding:10px 0}
.foot{text-align:center;margin-top:30px;font-size:17px}
.foot a{display:inline-block;padding:10px 18px;border:1.5px solid var(--gold);border-radius:999px;text-decoration:none;color:var(--ink)}
@media(prefers-reduced-motion:no-preference){.wish.new{animation:pop .5s ease-out}@keyframes pop{from{opacity:0;transform:translateY(-6px)}}}
</style>
</head>
<body>
<main class="wrap">
  <img class="slide" src="slide1.jpg" width="1080" height="1626" alt="Illustrated invitation: Mazen and Manar at the venue, with the line كان الهوى بيننا حكايه واليوم نكتب لها أحلى بدايه">
  <img class="slide" src="slide2.jpg" width="1080" height="1626" alt="Mazen and Manar joyfully invite you to celebrate the beginning of their love story. Sunday 29 November 2026 at 8:00 PM, Lagona Vista Hall." loading="lazy">
  <p class="hint">Scroll down to leave the couple a wish ♡</p>

  <section class="book" id="guestbook" aria-labelledby="gb-title">
    <h2 id="gb-title">Guest Book</h2>
    <p class="ar" lang="ar">دفتر الأمنيات</p>
    <p class="sub">Leave a wish for Mazen &amp; Manar, in Arabic or English</p>

    <form id="gb-form" novalidate>
      <div>
        <label for="gb-name">Your name</label>
        <input id="gb-name" name="name" maxlength="60" autocomplete="name" required dir="auto">
      </div>
      <div>
        <label for="gb-msg">Your wish</label>
        <textarea id="gb-msg" name="message" maxlength="600" required dir="auto" placeholder="Write something from the heart…"></textarea>
      </div>
      <div class="hp" aria-hidden="true"><label for="gb-web">Website</label><input id="gb-web" name="website" tabindex="-1" autocomplete="off"></div>
      <div class="row"><span id="gb-left">600 characters left</span><button id="gb-send" type="submit">Send wish</button></div>
      <p class="status" id="gb-status" role="status" aria-live="polite"></p>
    </form>

    <div class="orn" aria-hidden="true"><i></i>❦<i></i></div>
    <p class="count" id="gb-count"></p>
    <ul class="wishes" id="gb-list"><li class="empty">Loading wishes…</li></ul>
  </section>

  <p class="foot"><a href="invitation.pdf" target="_blank" rel="noopener">Download the invitation (PDF)</a></p>
</main>

<script>
{
  // ▼ Paste your Google Apps Script web app URL here (it ends with /exec)
  const GUESTBOOK_URL = "";

  const $ = id => document.getElementById(id);
  const form = $("gb-form"), list = $("gb-list"), status = $("gb-status"), send = $("gb-send");
  const nameEl = $("gb-name"), msgEl = $("gb-msg"), left = $("gb-left"), countEl = $("gb-count");
  let wishes = [];

  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const isAr = s => /[؀-ۿ]/.test(s);
  const fmt = t => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); };

  function render(newFirst){
    if(!wishes.length){ list.innerHTML = '<li class="empty">Be the first to leave a wish ♡</li>'; countEl.textContent=""; return; }
    countEl.textContent = wishes.length === 1 ? "1 wish so far" : wishes.length + " wishes so far";
    list.innerHTML = wishes.map((w,i) => `<li class="wish${newFirst && i===0 ? " new" : ""}">
      <p dir="${isAr(w.message) ? "rtl" : "ltr"}">${esc(w.message)}</p>
      <div class="by"><b dir="auto">${esc(w.name)}</b><span>${fmt(w.time)}</span></div></li>`).join("");
  }

  async function load(){
    if(!GUESTBOOK_URL){ list.innerHTML = '<li class="empty">The guest book opens soon ♡</li>'; send.disabled = true; return; }
    try{
      const r = await fetch(GUESTBOOK_URL, {cache:"no-store"});
      const d = await r.json();
      wishes = Array.isArray(d.rows) ? d.rows : [];
      render(false);
    }catch(e){ list.innerHTML = '<li class="empty">Wishes could not load right now. Please refresh in a moment.</li>'; }
  }

  msgEl.addEventListener("input", () => { left.textContent = (600 - msgEl.value.length) + " characters left"; });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = nameEl.value.trim(), message = msgEl.value.trim();
    if(!name || !message){ status.textContent = "Please write your name and your wish."; (name ? msgEl : nameEl).focus(); return; }
    if(!GUESTBOOK_URL) return;
    send.disabled = true; status.textContent = "Sending your wish…";
    try{
      const r = await fetch(GUESTBOOK_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({name, message, website: $("gb-web").value})});
      const d = await r.json();
      if(!d.ok) throw new Error(d.error || "failed");
      wishes.unshift({name, message, time: new Date().toISOString()});
      render(true);
      msgEl.value = ""; left.textContent = "600 characters left";
      status.textContent = "Thank you! Your wish was added ♡";
    }catch(err){
      status.textContent = "Sorry, that did not send. Please try again.";
    }finally{ send.disabled = false; }
  });

  load();
}
</script>
</body>
</html>
